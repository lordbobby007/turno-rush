<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Viral Video Feeds</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.feed{width:100%;height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain}
.video-card{position:relative;width:100%;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden}
.video-card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.28),transparent 25%,transparent 65%,rgba(0,0,0,.62))}
.topbar{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:19px;font-weight:900;text-shadow:0 2px 8px #000}.counter{font-size:12px;background:rgba(0,0,0,.45);padding:7px 10px;border-radius:20px}
.info{position:absolute;left:16px;right:82px;bottom:26px;z-index:5;text-shadow:0 2px 8px #000}.info h3{margin:0 0 7px;font-size:18px}.info p{margin:0;color:#eee;font-size:14px;line-height:1.35}
.actions{position:absolute;right:14px;bottom:26px;z-index:6;display:flex;flex-direction:column;gap:12px}.action{width:52px;height:52px;border:0;border-radius:50%;background:rgba(0,0,0,.52);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}.action:active{transform:scale(.93)}
.playHint{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none}.playIcon{width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;font-size:30px;opacity:0;transition:opacity .2s}.video-card.paused .playIcon{opacity:1}
.loading{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;font-size:13px;color:#ddd;background:rgba(0,0,0,.12)}.video-card.ready .loading{display:none}
.mutedLabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:7;background:rgba(0,0,0,.65);padding:9px 13px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none}.video-card.showMute .mutedLabel{animation:fade .9s ease}@keyframes fade{0%{opacity:1}100%{opacity:0}}
@media(min-width:700px){.feed{max-width:520px;margin:auto}}
</style>
</head>
<body>
<main id="feed" class="feed" aria-label="Video feed"></main>
<script>
"use strict";
const videos=[
 {src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",title:"Beautiful moment 🌸",caption:"Enjoy the video and keep scrolling."},
 {src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",title:"Watch this 👀",caption:"Swipe up for the next video."},
 {src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",title:"Another viral clip 🔥",caption:"More videos coming soon."},
 {src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",title:"Keep scrolling ▶️",caption:"Tap the screen to pause or play."},
 {src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",title:"Next video 🎬",caption:"This feed is ready for your real videos."},
 {src:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",title:"One more 👇",caption:"We can add your video URLs later."}
];
const feed=document.getElementById("feed");
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function makeCard(item,index){
 const card=document.createElement("section");card.className="video-card";
 card.innerHTML=`<video playsinline muted loop preload="${index<2?"auto":"metadata"}"></video><div class="loading">Loading video…</div><div class="shade"></div><div class="topbar"><div class="brand">Viral Videos</div><div class="counter">${index+1} / ${videos.length}</div></div><div class="playHint"><div class="playIcon">▶</div></div><div class="mutedLabel">🔇 Muted</div><div class="info"><h3>${esc(item.title)}</h3><p>${esc(item.caption)}</p></div><div class="actions"><button class="action mute" aria-label="Unmute video">🔇</button><button class="action play" aria-label="Play video">▶</button></div>`;
 const video=card.querySelector("video"),mute=card.querySelector(".mute"),play=card.querySelector(".play");video.src=item.src;
 video.addEventListener("loadeddata",()=>card.classList.add("ready"));video.addEventListener("error",()=>{card.classList.add("ready");card.querySelector(".loading").textContent="Video unavailable"});
 function togglePlay(){if(video.paused){video.play().catch(()=>{});card.classList.remove("paused");play.textContent="⏸"}else{video.pause();card.classList.add("paused");play.textContent="▶"}}
 function toggleMute(){video.muted=!video.muted;mute.textContent=video.muted?"🔇":"🔊";mute.setAttribute("aria-label",video.muted?"Unmute video":"Mute video");card.classList.add("showMute");setTimeout(()=>card.classList.remove("showMute"),950)}
 play.addEventListener("click",e=>{e.stopPropagation();togglePlay()});mute.addEventListener("click",e=>{e.stopPropagation();toggleMute()});video.addEventListener("click",togglePlay);return card;
}
videos.forEach((v,i)=>feed.appendChild(makeCard(v,i)));
const cards=[...document.querySelectorAll(".video-card")];
const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{const video=entry.target.querySelector("video"),play=entry.target.querySelector(".play");if(entry.isIntersecting&&entry.intersectionRatio>=.65){cards.forEach(other=>{if(other!==entry.target){const ov=other.querySelector("video");ov.pause();other.classList.remove("paused");other.querySelector(".play").textContent="▶"}});video.play().then(()=>{entry.target.classList.remove("paused");play.textContent="⏸"}).catch(()=>{entry.target.classList.add("paused");play.textContent="▶"})}else{video.pause();entry.target.classList.remove("paused");play.textContent="▶"}})},{root:feed,threshold:[.65]});
cards.forEach(card=>observer.observe(card));
document.addEventListener("visibilitychange",()=>{if(document.hidden)cards.forEach(c=>c.querySelector("video").pause());else{const i=Math.round(feed.scrollTop/feed.clientHeight),c=cards[i];if(c)c.querySelector("video").play().catch(()=>{})}});
</script>
</body>
</html>
