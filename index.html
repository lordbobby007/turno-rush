<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Turbo Rush</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  overflow: hidden;
  touch-action: manipulation;
}

.screen {
  width: 100vw;
  height: 100vh;
  display: none;
}

.screen.active {
  display: flex;
}


/* =========================
   HOME
========================= */

#home {
  background: linear-gradient(160deg,#10182f,#28134a);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.logo {
  font-size: 48px;
  margin-bottom: 5px;
}

h1 {
  font-size: 42px;
  margin: 0;
}

.subtitle {
  color: #aaa;
  margin-bottom: 30px;
}

.stats {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

.stat {
  background: rgba(255,255,255,.1);
  padding: 12px 18px;
  border-radius: 15px;
  text-align: center;
}

.stat b {
  display: block;
  font-size: 20px;
}

button {
  border: 0;
  border-radius: 15px;
  padding: 14px 20px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.startBtn {
  width: 240px;
  background: #ffcc00;
  color: #111;
  margin-bottom: 12px;
}

.garageBtn {
  width: 240px;
  background: rgba(255,255,255,.12);
  color: white;
}


/* =========================
   GARAGE
========================= */

#garage {
  background: linear-gradient(160deg,#10182f,#28134a);
  flex-direction: column;
  align-items: center;
  padding: 25px 15px;
  overflow-y: auto;
}

#garage h2 {
  margin: 5px 0;
}

.garageCoins {
  background: rgba(255,255,255,.1);
  padding: 10px 18px;
  border-radius: 14px;
  margin: 10px 0 15px;
  font-weight: bold;
}

.cars {
  width: 100%;
  max-width: 460px;
}

.car {
  background: rgba(255,255,255,.1);
  border: 2px solid transparent;
  padding: 14px;
  border-radius: 18px;
  margin: 9px 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.car.selected {
  border-color: #ffcc00;
}

.carEmoji {
  font-size: 42px;
  width: 55px;
  text-align: center;
}

.carInfo {
  flex: 1;
}

.carInfo b {
  font-size: 18px;
}

.carInfo small {
  color: #aaa;
  line-height: 1.6;
}

.carAction {
  min-width: 90px;
  padding: 10px 8px;
  font-size: 13px;
}

.buyBtn {
  background: #ffcc00;
  color: #111;
}

.selectBtn {
  background: #fff;
  color: #111;
}

.selectedBtn {
  background: #444;
  color: #aaa;
}

.locked {
  opacity: .85;
}


/* =========================
   RACE
========================= */

#race {
  position: relative;
  background: #222;
  flex-direction: column;
}

.hud {
  position: absolute;
  top: 10px;
  left: 8px;
  right: 8px;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  gap: 5px;
}

.hud span {
  background: rgba(0,0,0,.65);
  padding: 7px 8px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 14px;
  white-space: nowrap;
}

.road {
  position: absolute;
  left: 12%;
  right: 12%;
  top: 0;
  bottom: 0;
  background:
    repeating-linear-gradient(
      to bottom,
      #444 0px,
      #444 45px,
      #555 45px,
      #555 90px
    );
  border-left: 7px solid #ddd;
  border-right: 7px solid #ddd;
  overflow: hidden;
}

.laneLine {
  position: absolute;
  top: -100px;
  bottom: -100px;
  width: 5px;
  background:
    repeating-linear-gradient(
      to bottom,
      white 0px,
      white 60px,
      transparent 60px,
      transparent 120px
    );
  opacity: .7;
}

.lane1 {
  left: 33.33%;
}

.lane2 {
  left: 66.66%;
}

.carPlayer,
.traffic,
.coin {
  position: absolute;
  z-index: 5;
  user-select: none;
}

.carPlayer {
  font-size: 48px;
  bottom: 80px;
  transform: translateX(-50%);
}

.traffic {
  font-size: 45px;
  transform: translateX(-50%);
}

.coin {
  font-size: 28px;
  transform: translateX(-50%);
}

.controls {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  z-index: 30;
  display: flex;
  justify-content: space-between;
  padding: 0 25px;
}

.controlBtn {
  width: 90px;
  height: 65px;
  padding: 0;
  font-size: 30px;
  background: rgba(255,255,255,.2);
  color: white;
  border: 2px solid rgba(255,255,255,.3);
}

.countdown {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 90px;
  font-weight: bold;
  background: rgba(0,0,0,.45);
}

.hidden {
  display: none !important;
}


/* =========================
   GAME OVER
========================= */

.gameOver {
  position: absolute;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.78);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  flex-direction: column;
}

.gameOver h2 {
  font-size: 40px;
  margin: 0 0 15px;
}

.gameOver p {
  color: #ccc;
}

.againBtn {
  background: #ffcc00;
  color: #111;
  margin-top: 15px;
}

.homeBtn {
  background: #333;
  color: white;
  margin-top: 10px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

  .hud {
    gap: 3px;
  }

  .hud span {
    font-size: 11px;
    padding: 6px 5px;
  }

  .carEmoji {
    font-size: 35px;
    width: 45px;
  }

  .carInfo b {
    font-size: 15px;
  }

  .carInfo small {
    font-size: 11px;
  }

  .carAction {
    min-width: 75px;
    font-size: 11px;
  }

}

</style>
</head>


<body>


<!-- =========================
     HOME
========================= -->

<div id="home" class="screen active">

  <div class="logo">
    🏎️
  </div>

  <h1>
    Turbo Rush
  </h1>

  <div class="subtitle">
    Dodge. Drive. Survive.
  </div>


  <div class="stats">

    <div class="stat">
      🪙
      <b id="homeCoins">0</b>
      Coins
    </div>

    <div class="stat">
      🏆
      <b id="homeBest">0</b>
      Best
    </div>

    <div class="stat">
      🏁
      <b id="homeRaces">0</b>
      Races
    </div>

  </div>


  <button
    class="startBtn"
    id="startButton"
  >
    ▶ START RACE
  </button>


  <button
    class="garageBtn"
    id="garageButton"
  >
    🚘 GARAGE
  </button>

</div>



<!-- =========================
     GARAGE
========================= -->

<div id="garage" class="screen">

  <h2>
    🚘 Your Garage
  </h2>

  <div class="garageCoins">
    🪙 Coins:
    <span id="garageCoins">0</span>
  </div>


  <div class="cars">


    <!-- CAR 1 -->

    <div
      class="car"
      data-car="0"
    >

      <div class="carEmoji">
        🚗
      </div>

      <div class="carInfo">

        <b>
          Street Fox
        </b>

        <br>

        <small>
          Speed: ★★★☆☆
          <br>
          Free starter car
        </small>

      </div>

      <button
        class="carAction"
        data-action="select"
      >
        SELECT
      </button>

    </div>



    <!-- CAR 2 -->

    <div
      class="car"
      data-car="1"
    >

      <div class="carEmoji">
        🏎️
      </div>

      <div class="carInfo">

        <b>
          Rapid GT
        </b>

        <br>

        <small>
          Speed: ★★★★☆
          <br>
          Price: 🪙 100
        </small>

      </div>

      <button
        class="carAction"
        data-action="buy"
      >
        BUY 100
      </button>

    </div>



    <!-- CAR 3 -->

    <div
      class="car"
      data-car="2"
    >

      <div class="carEmoji">
        🚀
      </div>

      <div class="carInfo">

        <b>
          Rocket
        </b>

        <br>

        <small>
          Speed: ★★★★☆
          <br>
          Price: 🪙 300
        </small>

      </div>

      <button
        class="carAction"
        data-action="buy"
      >
        BUY 300
      </button>

    </div>



    <!-- CAR 4 -->

    <div
      class="car"
      data-car="3"
    >

      <div class="carEmoji">
        ⚡
      </div>

      <div class="carInfo">

        <b>
          Volt
        </b>

        <br>

        <small>
          Speed: ★★★★★
          <br>
          Price: 🪙 700
        </small>

      </div>

      <button
        class="carAction"
        data-action="buy"
      >
        BUY 700
      </button>

    </div>


  </div>


  <button
    class="startBtn"
    id="garageStart"
  >
    ▶ START RACE
  </button>


  <button
    class="garageBtn"
    id="backHome"
  >
    ← BACK
  </button>

</div>



<!-- =========================
     RACE
========================= -->

<div id="race" class="screen">


  <div class="hud">

    <span>
      🏆
      <span id="score">0</span>
    </span>

    <span>
      🪙
      <span id="raceCoins">0</span>
    </span>

    <span>
      📏
      <span id="distance">0</span>m
    </span>

    <span>
      ❤️
      <span id="lives">3</span>
    </span>

  </div>


  <div
    class="road"
    id="road"
  >

    <div class="laneLine lane1"></div>

    <div class="laneLine lane2"></div>


    <div
      id="player"
      class="carPlayer"
    >
      🚗
    </div>

  </div>


  <div
    id="countdown"
    class="countdown"
  >
    3
  </div>


  <div class="controls">

    <button
      class="controlBtn"
      id="leftButton"
    >
      ⬅️
    </button>

    <button
      class="controlBtn"
      id="rightButton"
    >
      ➡️
    </button>

  </div>


  <div
    id="gameOver"
    class="gameOver hidden"
  >

    <h2>
      💥 CRASH!
    </h2>

    <p id="finalText"></p>


    <button
      class="againBtn"
      id="againButton"
    >
      🔄 RACE AGAIN
    </button>


    <button
      class="homeBtn"
      id="raceHome"
    >
      🏠 HOME
    </button>

  </div>

</div>



<script>


/* =========================
   CAR DATA
========================= */

const cars = [

  {
    emoji: "🚗",
    speed: 1.00,
    price: 0
  },

  {
    emoji: "🏎️",
    speed: 1.08,
    price: 100
  },

  {
    emoji: "🚀",
    speed: 1.16,
    price: 300
  },

  {
    emoji: "⚡",
    speed: 1.25,
    price: 700
  }

];



/* =========================
   SAVED GAME
========================= */

let saved =
  JSON.parse(
    localStorage.getItem(
      "turboRush"
    )
  ) || {};


/*
   Make sure old players
   don't lose their progress.
*/

if (
  typeof saved.coins !== "number"
) {
  saved.coins = 0;
}


if (
  typeof saved.best !== "number"
) {
  saved.best = 0;
}


if (
  typeof saved.races !== "number"
) {
  saved.races = 0;
}


if (
  typeof saved.car !== "number"
) {
  saved.car = 0;
}


/*
   New unlocked-car system.

   Existing players automatically
   keep Street Fox unlocked.
*/

if (
  !Array.isArray(saved.unlocked)
) {

  saved.unlocked = [0];

}


/*
   Make sure car 0 is always unlocked.
*/

if (
  !saved.unlocked.includes(0)
) {

  saved.unlocked.push(0);

}


localStorage.setItem(
  "turboRush",
  JSON.stringify(saved)
);



/* =========================
   GAME VARIABLES
========================= */

let running = false;

let playerLane = 1;

let score = 0;

let distance = 0;

let raceCoins = 0;

let lives = 3;

let difficulty = 1;

let hitCooldown = 0;

let traffic = [];

let coins = [];

let lastTime = 0;

let spawnTimer = 0;

let coinTimer = 0;

let animationFrame;



/* =========================
   ELEMENTS
========================= */

const home =
  document.getElementById(
    "home"
  );

const garage =
  document.getElementById(
    "garage"
  );

const race =
  document.getElementById(
    "race"
  );


const startButton =
  document.getElementById(
    "startButton"
  );

const garageButton =
  document.getElementById(
    "garageButton"
  );

const garageStart =
  document.getElementById(
    "garageStart"
  );

const backHome =
  document.getElementById(
    "backHome"
  );


const road =
  document.getElementById(
    "road"
  );

const player =
  document.getElementById(
    "player"
  );


const scoreText =
  document.getElementById(
    "score"
  );

const raceCoinsText =
  document.getElementById(
    "raceCoins"
  );

const distanceText =
  document.getElementById(
    "distance"
  );

const livesText =
  document.getElementById(
    "lives"
  );


const countdown =
  document.getElementById(
    "countdown"
  );

const gameOver =
  document.getElementById(
    "gameOver"
  );

const finalText =
  document.getElementById(
    "finalText"
  );


const leftButton =
  document.getElementById(
    "leftButton"
  );

const rightButton =
  document.getElementById(
    "rightButton"
  );


const againButton =
  document.getElementById(
    "againButton"
  );

const raceHome =
  document.getElementById(
    "raceHome"
  );


const garageCoinsText =
  document.getElementById(
    "garageCoins"
  );



/* =========================
   SAVE
========================= */

function saveGame() {

  localStorage.setItem(
    "turboRush",
    JSON.stringify(saved)
  );

}



/* =========================
   HOME
========================= */

function updateHome() {

  document.getElementById(
    "homeCoins"
  ).textContent =
    saved.coins;


  document.getElementById(
    "homeBest"
  ).textContent =
    saved.best;


  document.getElementById(
    "homeRaces"
  ).textContent =
    saved.races;

}



/* =========================
   SCREEN
========================= */

function showScreen(screen) {

  home.classList.remove(
    "active"
  );

  garage.classList.remove(
    "active"
  );

  race.classList.remove(
    "active"
  );

  screen.classList.add(
    "active"
  );

}



/* =========================
   GARAGE DISPLAY
========================= */

function updateGarage() {

  garageCoinsText.textContent =
    saved.coins;


  document
    .querySelectorAll(".car")
    .forEach(card => {

      const index =
        Number(
          card.dataset.car
        );


      const button =
        card.querySelector(
          ".carAction"
        );


      const unlocked =
        saved.unlocked.includes(
          index
        );


      card.classList.remove(
        "selected"
      );

      card.classList.remove(
        "locked"
      );


      button.classList.remove(
        "buyBtn"
      );

      button.classList.remove(
        "selectBtn"
      );

      button.classList.remove(
        "selectedBtn"
      );


      if (
        saved.car === index
      ) {

        card.classList.add(
          "selected"
        );

        button.textContent =
          "✓ SELECTED";

        button.className =
          "carAction selectedBtn";

        button.disabled = true;

      }

      else if (unlocked) {

        button.textContent =
          "SELECT";

        button.className =
          "carAction selectBtn";

        button.disabled = false;

      }

      else {

        card.classList.add(
          "locked"
        );

        button.textContent =
          "BUY " +
          cars[index].price;

        button.className =
          "carAction buyBtn";

        button.disabled = false;

      }

    });

}



/* =========================
   GARAGE BUTTON ACTION
========================= */

document
  .querySelectorAll(".carAction")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();


        const card =
          button.closest(".car");


        const index =
          Number(
            card.dataset.car
          );


        const car =
          cars[index];


        const unlocked =
          saved.unlocked.includes(
            index
          );


        /*
           BUY
        */

        if (!unlocked) {

          if (
            saved.coins <
            car.price
          ) {

            alert(
              "You need " +
              car.price +
              " coins to unlock this car."
            );

            return;

          }


          saved.coins -=
            car.price;


          saved.unlocked.push(
            index
          );


          saved.car =
            index;


          saveGame();


          updateHome();

          updateGarage();


          alert(
            car.emoji +
            " " +
            "Car unlocked!"
          );


          return;

        }


        /*
           SELECT
        */

        saved.car =
          index;


        saveGame();


        updateHome();

        updateGarage();

      }
    );

  });



/* =========================
   HOME START
========================= */

startButton.addEventListener(
  "click",
  function() {

    startRace();

  }
);



/* =========================
   GARAGE OPEN
========================= */

garageButton.addEventListener(
  "click",
  function() {

    updateGarage();

    showScreen(
      garage
    );

  }
);



/* =========================
   GARAGE START
========================= */

garageStart.addEventListener(
  "click",
  function() {

    startRace();

  }
);



/* =========================
   BACK HOME
========================= */

backHome.addEventListener(
  "click",
  function() {

    updateHome();

    showScreen(
      home
    );

  }
);



/* =========================
   START RACE
========================= */

function startRace() {

  console.log(
    "START RACE"
  );


  showScreen(
    race
  );


  running = false;


  score = 0;

  distance = 0;

  raceCoins = 0;

  lives = 3;

  difficulty = 1;

  hitCooldown = 0;


  playerLane = 1;


  traffic = [];

  coins = [];


  document
    .querySelectorAll(
      ".traffic"
    )
    .forEach(
      x => x.remove()
    );


  document
    .querySelectorAll(
      ".coin"
    )
    .forEach(
      x => x.remove()
    );


  player.textContent =
    cars[
      saved.car
    ].emoji;


  gameOver.classList.add(
    "hidden"
  );


  updateHUD();


  placePlayer();


  countdown.classList.remove(
    "hidden"
  );


  let count = 3;


  countdown.textContent =
    count;


  const timer =
    setInterval(
      () => {

        count--;


        if (
          count > 0
        ) {

          countdown.textContent =
            count;

        }

        else if (
          count === 0
        ) {

          countdown.textContent =
            "GO!";

        }

        else {

          clearInterval(
            timer
          );


          countdown.classList.add(
            "hidden"
          );


          running = true;


          lastTime =
            performance.now();


          spawnTimer = 0;

          coinTimer = 0;


          animationFrame =
            requestAnimationFrame(
              gameLoop
            );

        }

      },
      700
    );

}



/* =========================
   PLAYER POSITION
========================= */

function placePlayer() {

  const width =
    road.clientWidth;


  const laneWidth =
    width / 3;


  const x =
    laneWidth *
      playerLane +
    laneWidth / 2;


  player.style.left =
    x + "px";

}



/* =========================
   LEFT
========================= */

function moveLeft() {

  if (!running)
    return;


  if (
    playerLane > 0
  ) {

    playerLane--;

    placePlayer();

  }

}



/* =========================
   RIGHT
========================= */

function moveRight() {

  if (!running)
    return;


  if (
    playerLane < 2
  ) {

    playerLane++;

    placePlayer();

  }

}



/* =========================
   CONTROLS
========================= */

leftButton.addEventListener(
  "click",
  moveLeft
);


rightButton.addEventListener(
  "click",
  moveRight
);



/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "ArrowLeft"
    ) {

      moveLeft();

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      moveRight();

    }

  }
);



/* =========================
   TRAFFIC
========================= */

function spawnTraffic() {

  const lane =
    Math.floor(
      Math.random() * 3
    );


  const vehicle =
    document.createElement(
      "div"
    );


  vehicle.className =
    "traffic";


  const vehicles = [

    "🚙",
    "🚕",
    "🚓",
    "🚚"

  ];


  vehicle.textContent =
    vehicles[
      Math.floor(
        Math.random() *
        vehicles.length
      )
    ];


  vehicle.dataset.lane =
    lane;


  vehicle.style.left =
    (
      (lane + 0.5) /
      3 *
      100
    ) + "%";


  vehicle.style.top =
    "-70px";


  road.appendChild(
    vehicle
  );


  traffic.push({

    el: vehicle,

    lane: lane,

    y: -70,

    speed:
      220 +
      Math.random() * 100

  });

}



/* =========================
   COIN
========================= */

function spawnCoin() {

  const lane =
    Math.floor(
      Math.random() * 3
    );


  const coin =
    document.createElement(
      "div"
    );


  coin.className =
    "coin";


  coin.textContent =
    "🪙";


  coin.style.left =
    (
      (lane + 0.5) /
      3 *
      100
    ) + "%";


  coin.style.top =
    "-50px";


  road.appendChild(
    coin
  );


  coins.push({

    el: coin,

    lane: lane,

    y: -50,

    speed: 230

  });

}



/* =========================
   COLLISION
========================= */

function hitPlayer(
  objY
) {

  const playerY =
    road.clientHeight -
    130;


  return (

    objY >
      playerY - 55

    &&

    objY <
      playerY + 55

  );

}



/* =========================
   GAME LOOP
========================= */

function gameLoop(time) {

  if (!running)
    return;


  const dt =
    Math.min(
      (
        time -
        lastTime
      ) / 1000,
      0.05
    );


  lastTime =
    time;


  /*
     Difficulty increases
     every 150 meters.
  */

  difficulty =
    1 +
    Math.floor(
      distance / 150
    );


  const speedMultiplier =
    cars[
      saved.car
    ].speed *
    (
      1 +
      (
        difficulty - 1
      ) *
      0.08
    );


  /*
     Temporary protection
     after collision.
  */

  if (
    hitCooldown > 0
  ) {

    hitCooldown -=
      dt;

  }


  /*
     Distance
  */

  distance +=
    dt *
    55 *
    speedMultiplier;


  /*
     Score
  */

  score =
    Math.floor(
      distance * 2
    );


  spawnTimer +=
    dt;


  coinTimer +=
    dt;


  /*
     Traffic becomes
     more frequent.
  */

  const trafficInterval =
    Math.max(
      0.65,
      1.1 -
      (
        difficulty - 1
      ) *
      0.04
    );


  if (
    spawnTimer >
    trafficInterval
  ) {

    spawnTraffic();

    spawnTimer = 0;

  }


  if (
    coinTimer >
    0.8
  ) {

    spawnCoin();

    coinTimer = 0;

  }



  /* =========================
     TRAFFIC
  ========================= */

  traffic.forEach(
    obj => {

      obj.y +=
        obj.speed *
        speedMultiplier *
        dt;


      obj.el.style.top =
        obj.y + "px";


      if (

        obj.lane ===
          playerLane

        &&

        hitPlayer(
          obj.y
        )

        &&

        hitCooldown <= 0

      ) {

        lives--;


        hitCooldown =
          1.2;


        obj.y =
          9999;


        obj.el.remove();


        updateHUD();


        if (
          lives <= 0
        ) {

          endRace();

        }

      }

    }
  );



  /* =========================
     COINS
  ========================= */

  coins.forEach(
    obj => {

      obj.y +=
        obj.speed *
        speedMultiplier *
        dt;


      obj.el.style.top =
        obj.y + "px";


      if (

        obj.lane ===
          playerLane

        &&

        hitPlayer(
          obj.y
        )

      ) {

        raceCoins++;


        obj.y =
          9999;


        obj.el.remove();


        updateHUD();

      }

    }
  );



  /* =========================
     REMOVE TRAFFIC
  ========================= */

  traffic =
    traffic.filter(
      obj => {

        if (
          obj.y >
          road.clientHeight +
          100
        ) {

          obj.el.remove();

          return false;

        }

        return true;

      }
    );



  /* =========================
     REMOVE COINS
  ========================= */

  coins =
    coins.filter(
      obj => {

        if (
          obj.y >
          road.clientHeight +
          100
        ) {

          obj.el.remove();

          return false;

        }

        return true;

      }
    );



  updateHUD();


  if (running) {

    animationFrame =
      requestAnimationFrame(
        gameLoop
      );

  }

}



/* =========================
   HUD
========================= */

function updateHUD() {

  scoreText.textContent =
    Math.floor(
      score
    );


  raceCoinsText.textContent =
    raceCoins;


  distanceText.textContent =
    Math.floor(
      distance
    );


  livesText.textContent =
    lives;

}



/* =========================
   END RACE
========================= */

function endRace() {

  if (!running)
    return;


  running = false;


  cancelAnimationFrame(
    animationFrame
  );


  /*
     Add collected coins
     to permanent balance.
  */

  saved.coins +=
    raceCoins;


  saved.races++;


  if (
    Math.floor(
      distance
    ) >
    saved.best
  ) {

    saved.best =
      Math.floor(
        distance
      );

  }


  saveGame();


  updateHome();


  finalText.textContent =
    "Score: " +
    Math.floor(score) +
    " • Distance: " +
    Math.floor(distance) +
    "m • Coins: " +
    raceCoins;


  gameOver.classList.remove(
    "hidden"
  );

}



/* =========================
   RACE AGAIN
========================= */

againButton.addEventListener(
  "click",
  function() {

    startRace();

  }
);



/* =========================
   RACE HOME
========================= */

raceHome.addEventListener(
  "click",
  function() {

    running = false;


    cancelAnimationFrame(
      animationFrame
    );


    gameOver.classList.add(
      "hidden"
    );


    updateHome();


    showScreen(
      home
    );

  }
);



/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  placePlayer
);



/* =========================
   INITIAL
========================= */

updateHome();

updateGarage();

</script>
